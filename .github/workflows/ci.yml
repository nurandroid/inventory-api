name: Inventory API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventory_test_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ci_test_password
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inventory_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Run tests and build JAR
        run: ./mvnw --batch-mode --no-transfer-progress clean package